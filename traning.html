<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Träna | Sophies klassrum</title><style>:root{--bg:#f4eee6;--paper:#fffaf4;--ink:#2d2723;--brown:#765845;--sand:#eadfd3;--line:#d9c9bb;--ok:#dfe9dc;--bad:#f1dfdb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}header{padding:14px 5vw;border-bottom:1px solid var(--line)}.logo{font:700 20px Georgia}.logo b{display:inline-grid;place-items:center;width:42px;height:42px;margin-right:10px;border-radius:13px;background:var(--ink);color:white}main{max-width:1050px;margin:auto;padding:30px 20px 70px}a,a:visited{color:var(--brown);text-decoration:none;font-weight:800}h1,h2,h3{font-family:Georgia;line-height:1.12}h1{font-size:clamp(40px,6vw,64px);margin:8px 0}.k{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--brown);text-transform:uppercase}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:25px;margin-top:22px}.answers{display:grid;gap:10px}.answer,.btn,.tile,.mem,.match{cursor:pointer}.answer,.match{border:1px solid var(--line);background:white;border-radius:11px;padding:13px;text-align:left;font:inherit}.btn{border:0;background:var(--ink);color:white;border-radius:10px;padding:11px 15px;font-weight:800}.feedback,.example{padding:13px;border-radius:10px;margin:12px 0}.correct{background:var(--ok)!important}.wrong{background:var(--bad)!important}.hidden{display:none!important}.input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin:8px 0}textarea{min-height:110px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cat{background:var(--ink);color:white;padding:11px 4px;text-align:center;font-weight:800;border-radius:8px;font-size:12px}.tile{border:0;background:#9a765e;color:white;font:700 19px Georgia;border-radius:8px;min-height:65px}.tile:disabled{background:#d9c9bb}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.selected{outline:3px solid var(--brown)}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mem{border:0;border-radius:11px;background:#9a765e;color:white;min-height:95px;padding:8px;font-weight:800}.mem.open,.mem.done{background:var(--sand);color:var(--ink)}.hint{background:var(--sand);padding:12px;border-radius:10px;margin:8px 0}@media(max-width:650px){.cat{font-size:9px}.tile{font-size:14px;min-height:54px}.panel{padding:14px}.memory{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}}</style></head><body><header><span class="logo"><b>S</b>Sophies klassrum</span></header><main><a id="back" href="spel.html">← Till spelbanken</a><div class="k" id="course" style="margin-top:28px"></div><h1 id="title">Spela & träna</h1><p id="intro"></p><section class="panel" id="game"></section></main><script>const p=new URLSearchParams(location.search),course=p.get('course')||'vard',game=p.get('game')||'sant';const DATA={vard:{name:'Grundläggande vård och omsorg',topic:'Personlig omvårdnad',back:'vard-omsorg-spel.html',terms:[['Personlig omvårdnad','Stöd och hjälp med personliga behov i vardagen'],['Integritet','Rätten till privatliv och respekt för kropp och gränser'],['Självbestämmande','Att personen så långt som möjligt får bestämma över sitt liv och sin hjälp'],['Samtycke','Att personen accepterar en insats efter information'],['Självständighet','Att få använda sina egna förmågor'],['Professionellt bemötande','Att vara respektfull, lyhörd och tydlig']],tf:[['Personlig omvårdnad ska utgå från individens behov.',true,'Ja. Hjälpen ska anpassas efter individens behov, vanor och förmågor.'],['Det är bäst att personalen gör allt så snabbt som möjligt.',false,'Nej. Personen ska få göra det hen klarar själv.'],['Integritet handlar bland annat om respekt för kropp och privatliv.',true,'Ja. Integritet är särskilt viktig när personal kommer nära personen.'],['Samtycke betyder att personen får information och accepterar hjälpen.',true,'Ja. Personen ska så långt som möjligt vara delaktig.'],['Självbestämmande betyder att personalen bestämmer vad som är bäst.',false,'Nej. Personen ska så långt som möjligt få bestämma över sin vardag.']],cases:[['Samira säger att hon vill välja kläder själv och kan ta på tröjan utan hjälp. Vad bör du göra?',['Göra allt åt henne för att spara tid','Låta henne välja och göra det hon klarar, och hjälpa vid behov','Bestämma kläder utan att fråga'],1,'Jag skulle låta Samira välja och göra det hon klarar själv. Det respekterar hennes självbestämmande och stärker självständigheten.']]},peda:{name:'Pedagogiskt arbete',topic:'Skapande, berättande och lärande',back:'pedagogiskt-arbete-spel.html',terms:[['Skapande verksamhet','Aktiviteter där deltagare uttrycker sig genom exempelvis bild, form, drama, dans eller musik'],['Pedagogisk aktivitet','En planerad aktivitet med ett syfte och mål'],['Delaktighet','Att få möjlighet att vara med och påverka'],['Dokumentation','Att synliggöra vad som har gjorts och hänt'],['Utvärdering','Att undersöka hur aktiviteten gick i förhållande till målet'],['Berättaraktivitet','En aktivitet där berättande används för språk, fantasi eller lärande']],tf:[['Skapande kan bidra till lärande och utveckling.',true,'Ja. Skapande kan utveckla bland annat fantasi, motorik, språk och samspel.'],['Alla barn måste skapa exakt samma sak.',false,'Nej. Skapande kan ge utrymme för egna idéer och uttryck.'],['En pedagogisk aktivitet bör ha ett syfte.',true,'Ja. Pedagogen behöver veta varför aktiviteten genomförs.'],['Utvärdering görs bara för att sätta betyg.',false,'Nej. Utvärdering används för att se vad som fungerade och vad som kan utvecklas.'],['Pedagogen kan behöva anpassa material och instruktioner.',true,'Ja. Anpassningar kan öka deltagandet.']],cases:[['Du planerar trolldeg med en barngrupp. Ett barn vill inte göra samma figur som ditt exempel. Vad är bäst?',['Kräva att alla gör samma figur','Låta barnet skapa på eget sätt inom aktivitetens ramar','Ta bort materialet'],1,'Jag skulle ge barnet utrymme att skapa på sitt eget sätt. Pedagogen kan ge stöd utan att styra resultatet för mycket.']]},halsa:{name:'Hälsa & hälsopedagogik',topic:'Salutogent perspektiv, hälsokorset och KASAM',back:'halsa-spel.html',terms:[['Salutogent perspektiv','Fokus på det som skapar och stärker hälsa'],['KASAM','Känsla av sammanhang'],['Begriplighet','Att förstå vad som händer och varför'],['Hanterbarhet','Att uppleva att man har resurser att klara situationen'],['Meningsfullhet','Att uppleva att något är viktigt och värt att engagera sig i'],['Hälsokorset','En modell som visar att upplevd hälsa och sjukdom inte alltid är samma sak']],tf:[['Salutogent perspektiv fokuserar på det som stärker hälsa.',true,'Ja. Fokus ligger på friskfaktorer och resurser.'],['KASAM består av begriplighet, hanterbarhet och meningsfullhet.',true,'Ja. Det är de tre delarna.'],['En person med sjukdom kan aldrig uppleva god hälsa.',false,'Nej. Hälsokorset visar att upplevd hälsa och sjukdom kan kombineras på olika sätt.'],['Begriplighet handlar om att förstå sin situation.',true,'Ja. Situationen behöver upplevas som någorlunda tydlig och förutsägbar.'],['Meningsfullhet betyder att allt måste vara lätt.',false,'Nej. Det handlar om att något känns viktigt och värt engagemang.']],cases:[['En elev är stressad men säger att skolarbetet känns viktigt. Hen har en tydlig plan och vet vem hen kan be om hjälp. Vilka delar av KASAM syns?',['Bara begriplighet','Begriplighet, hanterbarhet och meningsfullhet','Ingen del av KASAM'],1,'Planen kan skapa begriplighet, tillgång till hjälp ökar hanterbarheten och att skolarbetet känns viktigt visar meningsfullhet.']]}};const d=DATA[course]||DATA.vard;document.getElementById('course').textContent=d.name;document.getElementById('back').href=d.back;const G=document.getElementById('game');const names={jeopardy:'Jeopardy',sant:'Sant eller falskt',vem:'Vem/vad är jag?',matcha:'Matcha',case:'Case challenge',memory:'Memory'};document.getElementById('title').textContent=names[game]||'Spela & träna';document.getElementById('intro').textContent=d.topic;function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function sant(){let i=0,s=0;function r(){if(i>=d.tf.length){G.innerHTML='<h2>Klart! '+s+' av '+d.tf.length+' rätt.</h2><button class="btn" id="again">Spela igen</button>';again.onclick=()=>{i=0;s=0;r()};return}let q=d.tf[i];G.innerHTML='<p>Fråga '+(i+1)+' av '+d.tf.length+'</p><h2>'+q[0]+'</h2><div class="answers"><button class="answer" id="yes">Sant</button><button class="answer" id="no">Falskt</button></div><div id="fb" class="feedback"></div><button class="btn hidden" id="next">Nästa</button>';function a(v){let ok=v===q[1];if(ok)s++;fb.textContent=(ok?'Rätt! ':'Inte riktigt. ')+q[2];fb.className='feedback '+(ok?'correct':'wrong');yes.disabled=no.disabled=true;next.classList.remove('hidden')}yes.onclick=()=>a(true);no.onclick=()=>a(false);next.onclick=()=>{i++;r()}}r()}function matcha(memory){let items=shuffle(d.terms.flatMap((x,i)=>[{t:x[0],id:i},{t:x[1],id:i}])),first=null,lock=false,done=0;if(memory){G.innerHTML='<div class="memory" id="cards"></div><div id="fb" class="feedback"></div>';items.forEach(x=>{let b=document.createElement('button');b.className='mem';b.textContent='?';b.onclick=()=>{if(lock||b===first||b.classList.contains('done'))return;b.classList.add('open');b.textContent=x.t;b.dataset.id=x.id;if(!first){first=b;return}if(first.dataset.id==b.dataset.id){first.classList.add('done');b.classList.add('done');first=null;done+=2;if(done===items.length)fb.textContent='Alla par hittade!'}else{lock=true;let f=first;setTimeout(()=>{f.classList.remove('open');b.classList.remove('open');f.textContent=b.textContent='?';first=null;lock=false},700)}};cards.appendChild(b)})}else{G.innerHTML='<p>Klicka på två kort som hör ihop.</p><div class="cards" id="cards"></div><div id="fb" class="feedback"></div>';items.forEach(x=>{let b=document.createElement('button');b.className='match';b.textContent=x.t;b.dataset.id=x.id;b.onclick=()=>{if(b.disabled)return;if(!first){first=b;b.classList.add('selected');return}if(first===b)return;if(first.dataset.id==b.dataset.id){first.disabled=b.disabled=true;first.classList.add('correct');b.classList.add('correct');done+=2;fb.textContent=done===items.length?'Alla par hittade!':'Rätt par!'}else{first.classList.remove('selected');fb.textContent='Inte ett par. Försök igen.'}first=null};cards.appendChild(b)})}}function vem(){let i=0,h=1;function r(){let t=d.terms[i],hints=['Jag är ett viktigt begrepp i området '+d.topic+'.','Min förklaring börjar så här: '+t[1].split(' ').slice(0,4).join(' ')+'...','Jag är: '+t[0].charAt(0)+'...'];G.innerHTML='<p>Begrepp '+(i+1)+' av '+d.terms.length+'</p>'+hints.slice(0,h).map(x=>'<div class="hint">'+x+'</div>').join('')+'<input class="input" id="guess" placeholder="Skriv din gissning"><button class="btn" id="g">Gissa</button> <button class="btn" id="hint">Ny ledtråd</button><div id="fb" class="feedback"></div>';g.onclick=()=>{let ok=guess.value.toLowerCase().trim()===t[0].toLowerCase();fb.textContent=ok?'Rätt! '+t[0]:'Inte rätt ännu.';fb.className='feedback '+(ok?'correct':'wrong');if(ok)setTimeout(()=>{i=(i+1)%d.terms.length;h=1;r()},800)};hint.onclick=()=>{if(h<hints.length)h++;r()}}r()}function cas(){let c=d.cases[0];G.innerHTML='<h2>'+c[0]+'</h2><div class="answers">'+c[1].map((x,i)=>'<button class="answer" data-i="'+i+'">'+x+'</button>').join('')+'</div><div id="fb" class="feedback"></div><div id="reason" class="hidden"><h3>Motivera ditt val</h3><textarea id="txt" placeholder="Förklara hur du tänker..."></textarea><button class="btn" id="compare">Jämför med exempelsvar</button></div><div id="ex"></div>';G.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;G.querySelectorAll('.answer').forEach(x=>x.disabled=true);b.classList.add(i===c[2]?'correct':'wrong');G.querySelectorAll('.answer')[c[2]].classList.add('correct');reason.classList.remove('hidden');fb.textContent=i===c[2]?'Bra val. Förklara nu varför.':'Titta på det gröna alternativet och fundera på varför.';compare.onclick=()=>{if(txt.value.trim().length<15){ex.innerHTML='<div class="feedback wrong">Skriv först en kort motivering.</div>';return}ex.innerHTML='<div class="example"><b>Exempelsvar:</b> '+c[3]+'</div>'}})}function jeopardy(){let cats=['Begrepp','Förklara','Tillämpa','Situationer','Fördjupa'],score=0;G.innerHTML='<p><b>Dina poäng: <span id="score">0</span></b></p><div class="board" id="board"></div><div id="qbox"></div>';cats.forEach(x=>{let e=document.createElement('div');e.className='cat';e.textContent=x;board.appendChild(e)});for(let r=0;r<5;r++)for(let c=0;c<5;c++){let b=document.createElement('button');b.className='tile';b.textContent=(r+1)*100;b.onclick=()=>{b.disabled=true;let term=d.terms[(r+c)%d.terms.length],deep=r>=3;qbox.innerHTML='<div class="example"><div class="k">'+cats[c]+' • '+((r+1)*100)+' poäng</div><h2>'+(deep?'Förklara med egna ord: '+term[0]:'Vad betyder '+term[0]+'?')+'</h2>'+(deep?'<textarea id="ans"></textarea><button class="btn" id="check">Jämför med exempelsvar</button>':'<input class="input" id="ans" placeholder="Skriv ditt svar"><button class="btn" id="check">Kontrollera</button>')+'<div id="res"></div></div>';check.onclick=()=>{if(ans.value.trim().length<(deep?10:2)){res.innerHTML='<div class="feedback wrong">Skriv ett svar först.</div>';return}res.innerHTML='<div class="feedback correct"><b>Exempelsvar:</b> '+term[1]+'</div>';if(!deep){score+=(r+1)*100;document.getElementById('score').textContent=score}}};board.appendChild(b)}}if(game==='sant')sant();else if(game==='matcha')matcha(false);else if(game==='memory')matcha(true);else if(game==='vem')vem();else if(game==='case')cas();else jeopardy();</script></body></html>
