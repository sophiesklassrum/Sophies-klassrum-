<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Träna | Sophies klassrum</title><style>:root{--bg:#f4eee6;--paper:#fffaf4;--ink:#2d2723;--brown:#765845;--sand:#eadfd3;--line:#d9c9bb;--ok:#dfe9dc;--bad:#f1dfdb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}header{padding:14px 5vw;border-bottom:1px solid var(--line)}.logo{font:700 20px Georgia}.logo b{display:inline-grid;place-items:center;width:42px;height:42px;margin-right:10px;border-radius:13px;background:var(--ink);color:#fff}main{max-width:1050px;margin:auto;padding:30px 20px 70px}a{color:var(--brown);text-decoration:none;font-weight:800}h1,h2,h3{font-family:Georgia;line-height:1.12}h1{font-size:clamp(40px,6vw,64px);margin:8px 0}.k{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--brown);text-transform:uppercase}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:25px;margin-top:22px}.answers{display:grid;gap:10px}.answer,.match{border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px;text-align:left;font:inherit;cursor:pointer}.btn{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;margin:4px}.feedback,.example,.hint{padding:13px;border-radius:10px;margin:12px 0}.correct{background:var(--ok)!important}.wrong{background:var(--bad)!important}.hidden{display:none!important}.input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin:8px 0}textarea{min-height:110px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.selected{outline:3px solid var(--brown)}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mem{border:0;border-radius:11px;background:#9a765e;color:#fff;min-height:95px;padding:8px;font-weight:800;cursor:pointer}.mem.open,.mem.done{background:var(--sand);color:var(--ink)}.hint{background:var(--sand)}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cat{background:var(--ink);color:#fff;padding:10px 3px;text-align:center;font-weight:800;border-radius:8px;font-size:12px}.tile{border:0;background:#9a765e;color:#fff;font:700 18px Georgia;border-radius:8px;min-height:64px;cursor:pointer}.tile:disabled{background:#d9c9bb}@media(max-width:650px){.panel{padding:14px}.cards{grid-template-columns:1fr}.memory{grid-template-columns:repeat(2,1fr)}.cat{font-size:9px}.tile{font-size:14px;min-height:52px}}</style></head><body><header><span class="logo"><b>S</b>Sophies klassrum</span></header><main><a id="back">← Till kursens spel</a><div class="k" id="course" style="margin-top:28px"></div><h1 id="title"></h1><p id="intro"></p><section class="panel" id="game"></section></main><script>
const Q=new URLSearchParams(location.search),C=Q.get('course')||'vard',GAME=Q.get('game')||'sant';
const DATA={vard:{name:'Grundläggande vård och omsorg',topic:'Personlig omvårdnad',back:'vard-omsorg-spel.html',terms:[['Personlig omvårdnad','Stöd med personliga behov i vardagen'],['Integritet','Rätten till privatliv och respekt för kropp och gränser'],['Självbestämmande','Att få bestämma över sitt liv och sin hjälp'],['Samtycke','Att acceptera en insats efter information'],['Självständighet','Att få använda sina egna förmågor'],['Professionellt bemötande','Att vara respektfull, lyhörd och tydlig'],['Basala hygienrutiner','Rutiner som minskar smittspridning'],['Munvård','Omvårdnad av mun och tänder'],['Förflyttning','Att ändra läge eller plats på ett säkert sätt'],['Individanpassning','Att anpassa hjälpen efter personens behov'],['Delaktighet','Att få vara med och påverka'],['Ergonomi','Att arbeta så att belastning och skador minskar']],tf:[['Omvårdnad ska utgå från individens behov.',1],['Personalen bör göra allt för att spara tid.',0],['Integritet handlar om privatliv och kroppsliga gränser.',1],['Samtycke innebär att personen accepterar hjälpen efter information.',1],['Självbestämmande betyder att personalen bestämmer.',0],['Alla ska få exakt samma omvårdnad.',0],['Munvård är en del av personlig omvårdnad.',1],['Basala hygienrutiner minskar smittspridning.',1],['Den som kan tvätta ansiktet själv bör alltid få hjälp ändå.',0],['Dörren bör skydda mot insyn vid privata moment.',1],['Kommunikation är oviktig om personalen vet vad som ska göras.',0],['Ergonomi handlar även om personalens arbetsställning.',1],['Personens vanor kan vara viktiga i omvårdnaden.',1],['Samtycke behöver aldrig efterfrågas.',0],['Ett professionellt bemötande innebär att vara lyhörd.',1],['Självständighet betyder att personen aldrig får hjälp.',0],['Påklädning kan ingå i personlig omvårdnad.',1],['Personlig hygien kan påverka välbefinnandet.',1]],cases:[['Samira vill välja kläder själv och kan ta på tröjan.',['Gör allt åt henne','Låt henne välja och göra det hon klarar','Bestäm utan att fråga'],1,'Låt Samira göra det hon klarar. Det respekterar självbestämmande och stärker självständigheten.'],['En person vill inte duscha idag.',['Tvinga personen','Fråga varför och försök hitta en lösning tillsammans','Duscha snabbt ändå'],1,'Respektera personens vilja, informera och försök hitta en lösning tillsammans.'],['En kollega lämnar dörren öppen vid intimhygien.',['Stäng dörren','Låt den stå öppen','Ropa in fler'],0,'Skydda personens integritet och minska onödig insyn.'],['En person tar lång tid på sig att knäppa skjortan men klarar det.',['Ta över','Ge tid och erbjud hjälp vid behov','Säg åt personen att skynda'],1,'Ge tid så personen får använda sina förmågor.'],['En person förstår inte instruktionen inför en förflyttning.',['Genomför ändå','Anpassa kommunikationen först','Avsluta all hjälp'],1,'Anpassa informationen och skapa trygghet innan förflyttningen.']]},
peda:{name:'Pedagogiskt arbete',topic:'Skapande, berättande och lärande',back:'pedagogiskt-arbete-spel.html',terms:[['Skapande verksamhet','Aktiviteter med bild, form, drama, dans eller musik'],['Pedagogisk aktivitet','En planerad aktivitet med syfte och mål'],['Delaktighet','Att få vara med och påverka'],['Dokumentation','Att synliggöra vad som gjorts och hänt'],['Utvärdering','Att undersöka hur aktiviteten gick mot målet'],['Berättaraktivitet','Berättande för språk, fantasi eller lärande'],['Syfte','Varför en aktivitet genomförs'],['Mål','Vad deltagarna ska få möjlighet att utveckla'],['Anpassning','Att förändra aktivitet eller stöd så fler kan delta'],['Pedagogens roll','Att skapa förutsättningar, stödja och leda'],['Estetiska uttrycksformer','Bild, form, drama, dans och musik'],['Reflektion','Att tänka tillbaka och analysera vad som hände']],tf:[['Skapande kan bidra till lärande.',1],['Alla barn måste skapa exakt samma sak.',0],['En pedagogisk aktivitet bör ha ett syfte.',1],['Utvärdering görs bara för betyg.',0],['Material kan behöva anpassas.',1],['Dokumentation kan synliggöra en process.',1],['Skapande handlar bara om ett fint resultat.',0],['Berättande kan utveckla språk.',1],['Syfte och mål betyder exakt samma sak.',0],['Pedagogen ska alltid styra slutresultatet.',0],['Musik kan vara ett pedagogiskt redskap.',1],['Drama kan användas för lärande.',1],['Utvärdering kan förbättra nästa aktivitet.',1],['Delaktighet betyder att stöd aldrig behövs.',0],['Säkerhet behöver planeras.',1],['Öppna frågor kan stimulera reflektion.',1]],cases:[['Ett barn vill göra en annan figur av trolldegen.',['Kräv samma figur','Ge utrymme för eget skapande','Ta bort materialet'],1,'Ge utrymme för eget skapande inom aktivitetens ramar.'],['Två barn vill ha samma pensel.',['Avsluta aktiviteten','Stöd dem att hitta en lösning','Bestäm vem som är snällast'],1,'Stöd kommunikation och problemlösning och se över materialet.'],['Ett barn har svårt att hålla saxen.',['Låt barnet titta på','Anpassa material eller stöd','Klipp allt åt barnet'],1,'Anpassa så barnet kan delta så självständigt som möjligt.'],['Aktiviteten blev inte som planerat.',['Glöm det','Utvärdera och planera förbättringar','Skyll på gruppen'],1,'Utvärdera mot syfte och mål och fundera på förbättringar.'],['Barnen tappar intresset för berättelsen.',['Fortsätt exakt likadant','Anpassa och gör dem delaktiga','Skäll på gruppen'],1,'Anpassa berättandet med frågor, bilder, rörelser eller deltagande.']]},
halsa:{name:'Hälsa & hälsopedagogik',topic:'Salutogent perspektiv, hälsokorset och KASAM',back:'halsa-spel.html',terms:[['Salutogent perspektiv','Fokus på det som skapar och stärker hälsa'],['KASAM','Känsla av sammanhang'],['Begriplighet','Att förstå vad som händer och varför'],['Hanterbarhet','Att uppleva att resurser finns för att klara situationen'],['Meningsfullhet','Att något känns viktigt och värt engagemang'],['Hälsokorset','Modell som skiljer upplevd hälsa från sjukdom'],['Friskfaktor','Något som kan stärka hälsa'],['Riskfaktor','Något som kan öka risken för ohälsa'],['Fysisk hälsa','Hur kroppen mår och fungerar'],['Psykisk hälsa','Hur vi mår känslomässigt och psykiskt'],['Social hälsa','Relationer, gemenskap och socialt sammanhang'],['Hälsofrämjande arbete','Arbete som stärker möjligheter till hälsa']],tf:[['Salutogent perspektiv fokuserar på det som stärker hälsa.',1],['KASAM har tre delar.',1],['Den som har en sjukdom kan aldrig uppleva god hälsa.',0],['Begriplighet handlar om att förstå sin situation.',1],['Meningsfullhet betyder att allt måste vara lätt.',0],['Hanterbarhet handlar om resurser för att klara krav.',1],['KASAM betyder känsla av sammanhang.',1],['Salutogent perspektiv betyder att problem ignoreras.',0],['Sociala relationer kan påverka hälsan.',1],['Hälsa är bara fysisk.',0],['En riskfaktor kan öka risken för ohälsa.',1],['Sömn kan vara en friskfaktor.',1],['Hälsokorset har bara två lägen.',0],['Delaktighet kan stärka meningsfullhet.',1],['Tydlig information kan stärka begriplighet.',1],['Stöd från andra kan stärka hanterbarhet.',1]],cases:[['En elev är stressad men har plan, stöd och tycker arbetet är viktigt.',['Bara begriplighet','Alla tre delarna av KASAM','Ingen del'],1,'Plan kan ge begriplighet, stöd hanterbarhet och betydelsen meningsfullhet.'],['En person får behandling men förstår inte vad som ska hända.',['Ge mindre information','Ge tydlig information och möjlighet till frågor','Minska delaktigheten'],1,'Tydlig information kan stärka begripligheten.'],['En elev förstår uppgiften men saknar tid och stöd.',['Hanterbarhet är svag','Begriplighet är svag','Meningsfullhet är svag'],0,'Eleven förstår men saknar resurser att hantera situationen.'],['En person har kronisk sjukdom men upplever god hälsa.',['Det är omöjligt','Det passar med hälsokorset','Personen är inte sjuk'],1,'Hälsokorset skiljer medicinsk sjukdom från upplevd hälsa.'],['Deltagare får välja mellan flera aktiviteter.',['Det kan stärka delaktighet och meningsfullhet','Det påverkar bara fysisk styrka','Det saknar betydelse'],0,'Valmöjligheter kan öka delaktighet och meningsfullhet.']]}};
const d=DATA[C]||DATA.vard,G=document.getElementById('game'),sh=a=>a.slice().sort(()=>Math.random()-.5);course.textContent=d.name;back.href=d.back;intro.textContent=d.topic;title.textContent={jeopardy:'Jeopardy',sant:'Sant eller falskt',vem:'Vem/vad är jag?',matcha:'Matcha',case:'Case challenge',memory:'Memory'}[GAME];
function sant(){let a=sh(d.tf).slice(0,15),i=0,s=0;function r(){if(i===a.length){G.innerHTML='<h2>'+s+' av '+a.length+' rätt</h2><p>Nästa omgång slumpas om.</p><button class="btn" id="again">Spela igen</button>';again.onclick=sant;return}let q=a[i];G.innerHTML='<p>Fråga '+(i+1)+' av '+a.length+'</p><h2>'+q[0]+'</h2><div class="answers"><button class="answer" id="yes">Sant</button><button class="answer" id="no">Falskt</button></div><div id="fb" class="feedback"></div><button class="btn hidden" id="next">Nästa</button>';function x(v){let ok=v===q[1];if(ok)s++;fb.textContent=ok?'Rätt!':'Inte riktigt. Fundera på begreppet och försök komma ihåg rätt svar.';fb.className='feedback '+(ok?'correct':'wrong');yes.disabled=no.disabled=true;next.classList.remove('hidden')}yes.onclick=()=>x(1);no.onclick=()=>x(0);next.onclick=()=>{i++;r()}}r()}
function pairs(mem){let base=sh(d.terms).slice(0,mem?8:10),items=sh(base.flatMap((x,i)=>[{t:x[0],id:i},{t:x[1],id:i}])),first=null,lock=0,done=0;G.innerHTML='<p>'+(mem?'Hitta begreppet och rätt förklaring.':'Matcha begrepp och förklaring.')+'</p><div class="'+(mem?'memory':'cards')+'" id="cards"></div><div id="fb" class="feedback"></div>';items.forEach(x=>{let b=document.createElement('button');b.className=mem?'mem':'match';b.textContent=mem?'?':x.t;b.dataset.id=x.id;b.onclick=()=>{if(lock||b.disabled||b===first)return;if(mem){b.textContent=x.t;b.classList.add('open')}if(!first){first=b;b.classList.add('selected');return}if(first.dataset.id===b.dataset.id){first.disabled=b.disabled=true;first.classList.add('correct','done');b.classList.add('correct','done');done+=2;fb.textContent=done===items.length?'Alla par hittade!':'Rätt par!';first=null}else{let f=first;f.classList.remove('selected');fb.textContent='Inte ett par.';if(mem){lock=1;setTimeout(()=>{f.textContent=b.textContent='?';f.classList.remove('open');b.classList.remove('open');first=null;lock=0},650)}else first=null}};cards.appendChild(b)})}
function vem(){let a=sh(d.terms).slice(0,10),i=0,h=1;function r(){if(i===a.length){G.innerHTML='<h2>Alla 10 klara!</h2><button class="btn" id="again">Ny omgång</button>';again.onclick=vem;return}let t=a[i],hs=['Jag är ett viktigt begrepp i '+d.topic+'.','Jag handlar om: '+t[1].split(' ').slice(0,5).join(' ')+'...','Min första bokstav är '+t[0][0]+'.'];G.innerHTML='<p>Begrepp '+(i+1)+' av '+a.length+'</p>'+hs.slice(0,h).map(z=>'<div class="hint">'+z+'</div>').join('')+'<input class="input" id="guess"><button class="btn" id="go">Gissa</button><button class="btn" id="more">Ledtråd</button><div id="fb" class="feedback"></div>';go.onclick=()=>{let ok=guess.value.trim().toLowerCase()===t[0].toLowerCase();fb.textContent=ok?'Rätt! '+t[0]:'Inte rätt ännu.';fb.className='feedback '+(ok?'correct':'wrong');if(ok)setTimeout(()=>{i++;h=1;r()},650)};more.onclick=()=>{if(h<3)h++;r()}}r()}
function cases(){let a=sh(d.cases),i=0;function r(){if(i===a.length){G.innerHTML='<h2>Alla '+a.length+' case klara!</h2><button class="btn" id="again">Spela igen</button>';again.onclick=cases;return}let c=a[i];G.innerHTML='<p>Case '+(i+1)+' av '+a.length+'</p><h2>'+c[0]+'</h2><div class="answers">'+c[1].map((x,j)=>'<button class="answer" data-i="'+j+'">'+x+'</button>').join('')+'</div><div id="fb" class="feedback"></div><div id="reason" class="hidden"><h3>Motivera ditt val</h3><textarea id="txt"></textarea><button class="btn" id="compare">Jämför</button></div><div id="ex"></div>';G.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let j=+b.dataset.i;G.querySelectorAll('.answer').forEach(x=>x.disabled=true);b.classList.add(j===c[2]?'correct':'wrong');G.querySelectorAll('.answer')[c[2]].classList.add('correct');reason.classList.remove('hidden');compare.onclick=()=>{if(txt.value.trim().length<15){ex.innerHTML='<div class="feedback wrong">Skriv först en kort motivering.</div>';return}ex.innerHTML='<div class="example"><b>Exempelsvar:</b> '+c[3]+'</div><button class="btn" id="nextcase">Nästa case</button>';nextcase.onclick=()=>{i++;r()}}})}r()}
function jeopardy(){let cats=['Begrepp','Förklara','Tillämpa','Situationer','Fördjupa'];G.innerHTML='<div class="board" id="board"></div><div id="box"></div>';cats.forEach(x=>{let e=document.createElement('div');e.className='cat';e.textContent=x;board.appendChild(e)});for(let r=0;r<5;r++)for(let c=0;c<5;c++){let b=document.createElement('button');b.className='tile';b.textContent=(r+1)*100;b.onclick=()=>{b.disabled=true;let t=d.terms[(r*5+c)%d.terms.length];box.innerHTML='<div class="example"><h2>'+(r>2?'Förklara med egna ord och ge gärna exempel: ':'Vad betyder ')+t[0]+'?</h2><textarea id="ans"></textarea><button class="btn" id="check">Jämför svar</button><div id="res"></div></div>';check.onclick=()=>{if(ans.value.trim().length<8){res.innerHTML='<div class="feedback wrong">Skriv lite mer först.</div>';return}res.innerHTML='<div class="feedback correct"><b>Exempelsvar:</b> '+t[1]+'</div>'}};board.appendChild(b)}}
if(GAME==='sant')sant();else if(GAME==='matcha')pairs(0);else if(GAME==='memory')pairs(1);else if(GAME==='vem')vem();else if(GAME==='case')cases();else jeopardy();
</script></body></html>
