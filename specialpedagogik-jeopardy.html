<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeopardy | Sophies klassrum</title><style>:root{--bg:#f4eee6;--paper:#fffaf4;--ink:#2d2723;--brown:#765845;--sand:#eadfd3;--line:#d9c9bb;--ok:#dfe9dc;--bad:#f1dfdb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}header{padding:14px 5vw;border-bottom:1px solid var(--line)}.logo{font:700 20px Georgia,serif}.logo b{display:inline-grid;place-items:center;width:42px;height:42px;margin-right:10px;border-radius:13px;background:var(--ink);color:#fff}main{max-width:1050px;margin:auto;padding:30px 18px 70px}a,a:visited{color:var(--brown);font-weight:800;text-decoration:none}h1,h2,h3{font-family:Georgia,serif;line-height:1.12}h1{font-size:clamp(40px,6vw,66px);margin:8px 0}.kicker{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--brown);text-transform:uppercase}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:25px;margin-top:22px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cat{background:var(--ink);color:#fff;padding:12px 4px;text-align:center;font-weight:800;border-radius:8px;font-size:13px}.tile{border:0;background:#9a765e;color:#fff;font:700 20px Georgia,serif;border-radius:8px;min-height:72px;cursor:pointer}.tile:disabled{background:#d9c9bb;color:#82766d}.question{display:none;background:var(--sand);border-radius:16px;padding:20px;margin-top:20px}.question.show{display:block}.input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin:8px 0}textarea{min-height:110px}.btn{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.feedback,.example{padding:12px;border-radius:10px;margin:12px 0}.correct{background:var(--ok)}.wrong{background:var(--bad)}.hidden{display:none!important}@media(max-width:650px){.cat{font-size:9px;padding:8px 2px}.tile{font-size:14px;min-height:55px}.panel{padding:14px}}</style></head><body><header><span class="logo"><b>S</b>Sophies klassrum</span></header><main><a href="specialpedagogik-spel.html">← Till spelbanken</a><div class="kicker" style="margin-top:28px">Specialpedagogik • Funktionsnedsättningar</div><h1>Jeopardy</h1><p>Välj en ruta. På 100–300 poäng skriver du ett kort svar. På 400–500 poäng skriver du ett resonemang innan exempelsvaret visas.</p><section class="panel"><p><b>Dina poäng: <span id="score">0</span></b></p><div class="board" id="board"></div><div class="question" id="question"><div class="kicker" id="meta"></div><h2 id="qtext"></h2><div id="short"><input id="answer" class="input" placeholder="Skriv ditt svar här"><button id="check" class="btn">Kontrollera svar</button></div><div id="deep" class="hidden"><textarea id="reason" placeholder="Skriv ditt resonemang här innan du tittar på exempelsvaret..."></textarea><button id="compare" class="btn">Jämför med exempelsvar</button></div><div id="feedback" class="feedback"></div><div id="example" class="example hidden"></div></div></section></main><script>document.addEventListener('DOMContentLoaded',function(){const $=id=>document.getElementById(id),norm=s=>s.toLowerCase().trim().replace(/[.,!?]/g,'');const cats=['Begrepp','Diagnoser','Utredningar','Anpassningar','Vem gör vad?'];const q=[[['Vad kallas nedsatt fysisk, psykisk eller intellektuell funktionsförmåga?','Funktionsnedsättning',['funktionsnedsättning']],['Vad uppstår i mötet mellan en person och en otillgänglig miljö?','Funktionshinder',['funktionshinder']],['Vad betyder NPF?','Neuropsykiatriska funktionsnedsättningar',['neuropsykiatriska funktionsnedsättningar']],['Förklara skillnaden mellan funktionsnedsättning och funktionshinder.','En funktionsnedsättning handlar om personens funktionsförmåga. Ett funktionshinder uppstår när omgivningen skapar hinder.',[]],['Varför kan två personer med samma diagnos behöva olika stöd?','En diagnos beskriver inte hela personen. Styrkor, svårigheter och behov varierar mellan individer.',[]]],[['Nämn en NPF.','Till exempel ADHD eller autism',['adhd','autism']],['Vilken NPF kan innebära svårigheter med koncentration och impulskontroll?','ADHD',['adhd']],['Vilken NPF kan påverka social kommunikation och behov av tydlighet?','Autism',['autism']],['Varför beskriver en diagnos inte hela personen?','Människor med samma diagnos kan ha olika styrkor, svårigheter och behov.',[]],['Vad kan bli problemet om personal bara utgår från diagnosen?','Stödet kan bli fel eller stereotypiskt. Individens faktiska behov behöver styra.',[]]],[['Vilken utredning tittar på lärande och skolsituation?','Pedagogisk utredning',['pedagogisk utredning']],['Vilken utredning undersöker medicinska orsaker?','Medicinsk utredning',['medicinsk utredning']],['Vilken utredning kan undersöka kognitiva förmågor?','Psykologisk utredning',['psykologisk utredning']],['Varför kan flera utredningsperspektiv behövas?','De ger tillsammans en bredare bild av personens styrkor, svårigheter och stödbehov.',[]],['Hur kan pedagogisk och psykologisk utredning komplettera varandra?','Den pedagogiska visar hur lärandet och skolsituationen fungerar. Den psykologiska kan ge kunskap om kognitiva förmågor.',[]]],[['Nämn en anpassning för en elev som behöver tydlighet.','Till exempel visuellt schema eller steg-för-steg-instruktion.',['schema','steg för steg','steg-för-steg']],['Vad kan hjälpa en person som blir stressad av mycket ljud?','Till exempel en lugnare arbetsplats eller hörselkåpor.',['lugn arbetsplats','lugnare arbetsplats','hörselkåpor']],['En rullstolsanvändare möter en trappa. Nämn en förändring som minskar hindret.','Till exempel hiss, ramp eller tillgänglig lokal.',['hiss','ramp','tillgänglig lokal']],['Varför innebär en anpassning inte alltid att kraven tas bort?','Man kan ändra vägen till målet utan att ta bort målet, till exempel genom tydligare instruktioner eller lugnare miljö.',[]],['Ge ett exempel på hur miljön kan skapa ett funktionshinder och hur det kan minskas.','Exempel: En trappa kan hindra en rullstolsanvändare. Ramp eller hiss minskar hindret.',[]]],[['Vem arbetar med tal, språk och kommunikation?','Logoped',['logoped']],['Vilken funktion i skolan arbetar gemensamt med elevers hälsa och lärande?','Elevhälsan',['elevhälsa','elevhälsan']],['Vart kan barn och unga få specialiststöd vid psykisk ohälsa?','BUP',['bup','barn och ungdomspsykiatrin']],['Varför är samverkan mellan professioner viktig?','Olika professioner bidrar med olika kunskap och kan tillsammans skapa ett mer sammanhängande stöd.',[]],['En elev har svårigheter med språk, lärande och psykiskt mående. Varför kan flera professioner behöva samarbeta?','Behoven finns inom flera områden. Olika professioner kan bidra med olika kunskap och tillsammans skapa ett bättre stöd.',[]]];let current=null,score=0;cats.forEach(c=>{let d=document.createElement('div');d.className='cat';d.textContent=c;$('board').appendChild(d)});for(let r=0;r<5;r++){for(let c=0;c<5;c++){let b=document.createElement('button');b.className='tile';b.textContent=(r+1)*100;b.onclick=function(){b.disabled=true;current={c,r,p:(r+1)*100};let item=q[c][r];$('question').classList.add('show');$('meta').textContent=cats[c]+' • '+current.p+' poäng • '+(r<3?'Grundnivå':'Fördjupning');$('qtext').textContent=item[0];$('feedback').textContent='';$('feedback').className='feedback';$('example').classList.add('hidden');$('answer').value='';$('reason').value='';$('short').classList.toggle('hidden',r>=3);$('deep').classList.toggle('hidden',r<3);$('question').scrollIntoView({behavior:'smooth',block:'center'})};$('board').appendChild(b)}}$('check').onclick=function(){let item=q[current.c][current.r],v=norm($('answer').value);if(!v){$('feedback').textContent='Skriv ett svar först.';return}let ok=item[2].some(a=>v.includes(norm(a)));$('feedback').textContent=ok?'Rätt! Du får '+current.p+' poäng.':'Inte riktigt. Titta på rätt svar och jämför.';$('feedback').className='feedback '+(ok?'correct':'wrong');if(ok){score+=current.p;$('score').textContent=score}$('example').innerHTML='<b>Rätt svar:</b> '+item[1];$('example').classList.remove('hidden')};$('compare').onclick=function(){let text=$('reason').value.trim();if(text.length<15){$('feedback').textContent='Skriv först en kort förklaring med egna ord.';$('feedback').className='feedback wrong';return}let item=q[current.c][current.r];$('feedback').textContent='Nu kan du jämföra ditt resonemang med exempelsvaret.';$('feedback').className='feedback correct';$('example').innerHTML='<b>Exempelsvar:</b> '+item[1]+'<br><br><b>Jämför med ditt svar:</b> Har du förklarat hur eller varför och fått med ett relevant samband?';$('example').classList.remove('hidden')}});</script></body></html>
